services:
  redis:
    image: redis:7-alpine
    container_name: infobud-poc-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - infobud-poc-network

  postgres:
    image: postgres:13-alpine
    container_name: infobud-poc-postgres-dev
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - infobud-poc-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: infobud-poc-backend-dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - infobud-poc-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: infobud-poc-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - FAST_REFRESH=true
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - infobud-poc-network
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  redis_data:
  postgres_data:

networks:
  infobud-poc-network:
    driver: bridge
