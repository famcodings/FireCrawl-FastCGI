# A generic, single database configuration.

[alembic]
# A name for the alembic repository. This is used to construct the
# name of the script directory, and is also used by the 'multidb'
# migration feature.
#
# This value is safe to change at any time.
#
repo_name = alembic

# Path to the alembic script directory, relative to the main configuration
# file.
#
# This value is safe to change at any time.
#
script_location = alembic

# An optional relative path from the script directory to the versions
# subdirectory.
#
# This value is safe to change at any time.
#
# version_locations = versions

# The template used to generate new migration scripts.
#
# This value is safe to change at any time.
#
# file_template = %%(rev)s_%%(slug)s

# The timezone to use when stamping migration files.
#
# This value is safe to change at any time.
#
# timezone =

# The file system character encoding to use.
#
# This value is safe to change at any time.
#
# output_encoding = utf-8

sqlalchemy.url = %(DATABASE_URL)s


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner, against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# lint with attempts to fix using "ruff" - use the exec runner, execute a binary
# hooks = ruff
# ruff.type = exec
# ruff.executable = %(here)s/.venv/bin/ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
